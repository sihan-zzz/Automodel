task: bbh_think
dataset_path: SaylorTwift/bbh
dataset_name: default
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: "{{input}}\n\nAnswer with just the correct answer."
doc_to_target: "{{target}}"
generation_kwargs:
  until:
    - "<end_of_turn>"
    - "<eos>"
    - "<turn|>"
  temperature: 1.0
  top_k: 64
  top_p: 0.95
  do_sample: true
  max_gen_toks: 8192
filter_list:
  - name: thinking_flex
    filter:
      - function: regex
        regex_pattern: "(?:(?:answer|choice)\\s*(?:is|:)\\s*\\(?\\s*)?(\\([A-Za-z]\\)|True|False|[A-Za-z]+)(?:\\.|,|\\s|$)"
        group_select: -1
        fallback: "[invalid]"
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
