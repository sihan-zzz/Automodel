# Phase CPT: Full model training with ads + replay data
# Aligned with amaia cpt_v5b_from_zg7b.yaml (identical GBS, steps, LR):
#   8 nodes (64 GPUs), batch=4/GPU, seq=8192, GBS=256, grad_acc=1
#   8600 steps, lr=1e-5 → cosine → 5e-7, warmup 0-200
#   Data: 70% ads + 12.5% FineWeb + 8.75% OpenWebMath + 5% arXiv + 3.75% StackEx
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 8600
dist_env:
  backend: nccl
  timeout_minutes: 60
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 777
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  # Load S0 warmup checkpoint (consolidated HF format)
  pretrained_model_name_or_path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_cpt_s0/epoch_0_step_1199/model/consolidated
  torch_dtype: bfloat16
  trust_remote_code: true
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
checkpoint:
  enabled: true
  checkpoint_dir: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_cpt_ads
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: streaming_gemma4_dataset.StreamingGemma4Dataset
  mode: cpt
  sources:
    # 70% ads
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/ads_v4.1/train
      weight: 70.0
    # 30% replay (5R split)
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/fineweb-edu-100bt-jsonl
      weight: 12.5
    # TODO: verify these replay paths on Lustre
    # - path: /mnt/lustre/.../openwebmath-jsonl
    #   weight: 8.75
    # - path: /mnt/lustre/.../arxiv-jsonl
    #   weight: 5.0
    # - path: /mnt/lustre/.../stackexchange-jsonl
    #   weight: 3.75
  seq_length: 8192
  pack_size: 8192
  shuffle_buffer_size: 64
packed_sequence:
  packed_sequence_size: 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater_with_mm
  batch_size: 4
  num_workers: 0
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
# TODO: LR scheduler — warmup 0-200, cosine 200-8600, min_lr=5e-7
