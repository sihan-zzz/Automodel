# Phase SFT: Mixed ads + general instruction training
# Follows amaia sft_distill_v7_profile_keep_desc pattern
# Continue from CPT checkpoint
# Data mix: 50% Tulu3 + 20% UIH + 10% targeting + 5% CPT rehearsal + 15% FineWeb
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 16
  local_batch_size: 2
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 1
  max_steps: 1500
dist_env:
  backend: nccl
  timeout_minutes: 30
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  # TODO: update to CPT checkpoint path after CPT completes
  pretrained_model_name_or_path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_cpt_ads/checkpoint_0000008600
  torch_dtype: bfloat16
  trust_remote_code: true
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
checkpoint:
  enabled: true
  path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_sft_ads
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: streaming_gemma4_dataset.StreamingGemma4Dataset
  mode: sft
  sources:
    # SFT sources (dialog format, assistant-only loss)
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/tulu3_sft
      weight: 0.50
      type: sft
    # TODO: generate UIH distill v7 data for Gemma4 tokenizer
    # - path: .../uih_distill_v7/profile_keep_desc.jsonl
    #   weight: 0.20
    #   type: sft
    # - path: .../targeting_v9/targeting_v9_train.jsonl
    #   weight: 0.10
    #   type: sft
    # CPT replay sources (pretrain format, all-token loss, wrap-around)
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/ads_v4.1/train
      weight: 0.05
      type: cpt
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/fineweb-edu-10bt-jsonl
      weight: 0.15
      type: cpt
  seq_length: 4096
  pack_size: 4096
  shuffle_buffer_size: 64
  convert_thinking: false
packed_sequence:
  packed_sequence_size: 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater_with_mm
  batch_size: 2
  num_workers: 0
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
