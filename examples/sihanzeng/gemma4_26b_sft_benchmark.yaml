# Gemma4 26B-A4B-it MoE SFT — MFU benchmark config
# Matches amaia SFT: seq_len=8k, 2 nodes (16 GPUs), packed sequences
# Target: match amaia 4B baseline of 1,812 tok/s/gpu

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 64
  local_batch_size: 4
  ckpt_every_steps: 50
  val_every_steps: 9999
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/models/gemma-4-26B-A4B-it
  torch_dtype: bfloat16
  trust_remote_code: true
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  text_config:
    use_cache: false

checkpoint:
  enabled: true
  checkpoint_dir: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_it_benchmark/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: blended_chat_dataset.BlendedChatDataset
  sources:
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/tulu3_sft
      weight: 0.8
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/step_3p5_flash_sft
      weight: 0.2
  seq_length: 8192
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]
