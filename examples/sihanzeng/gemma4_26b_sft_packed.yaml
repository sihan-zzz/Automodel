# Gemma4 26B-A4B-it MoE SFT — Step3.5 (0.5) + JackRong SFT (0.5)
# 16k packed sequences, 4 nodes, assistant-only loss masking
# Samples > 16k are dropped (not truncated)

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 1
  max_steps: 500

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/models/gemma-4-26B-A4B-it
  torch_dtype: bfloat16
  trust_remote_code: true
  attn_implementation: eager
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/nemo_runs/gemma4_sft_cosine/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: streaming_packed_dataset.StreamingPackedDataset
  sources:
    - path: /mnt/lustre/metavmds0lstre/teams/ads_cpt/datasets/step_3p5_flash_sft
      weight: 0.5
    - path: /mnt/lustre/metavmds0lstre/checkpoints/sihanzeng/data/jackrong_sft
      weight: 0.5
  seq_length: 16384
  packed_sequence_size: 16384
  shuffle_buffer_size: 64
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: streaming_packed_dataset.packed_thd_collater_with_mm
  batch_size: 1
  num_workers: 4
  prefetch_factor: 10
  pin_memory: true
  persistent_workers: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-6
  weight_decay: 0.01
  betas: [0.9, 0.95]

lr_scheduler:
  lr_warmup_steps: 50
  lr_decay_style: cosine
  min_lr: 5e-7
